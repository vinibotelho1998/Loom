name: Build e Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Rodar a bateria de testes
        run: python testes/rodar.py

      - name: Incrementar versao
        id: versao
        run: |
          $conteudo = Get-Content -Path "loom/__init__.py" -Raw
          $m = [regex]::Match($conteudo, '__version__\s*=\s*"(\d+)\.(\d+)\.(\d+)"')
          if (-not $m.Success) { throw "Nao achei __version__ no formato X.Y.Z" }
          $major = [int]$m.Groups[1].Value
          $minor = [int]$m.Groups[2].Value
          $patch = [int]$m.Groups[3].Value + 1
          $nova = "$major.$minor.$patch"

          $conteudo = $conteudo -replace '__version__\s*=\s*"\d+\.\d+\.\d+"', "__version__ = `"$nova`""
          Set-Content -Path "loom/__init__.py" -Value $conteudo -NoNewline

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loom/__init__.py
          git commit -m "chore: incrementa versao para $nova [skip ci]"
          git push origin HEAD:main

          echo "numero=$nova" >> $env:GITHUB_OUTPUT

      - name: Build do app (PyInstaller)
        run: pyinstaller packaging/Loom.spec --noconfirm --distpath dist --workpath build

      - name: Baixar dependencias de runtime (VC++)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/prepare_prereqs.ps1

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar instalador
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.versao.outputs.numero }}" packaging\Loom_Setup.iss

      - name: Publicar release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest "dist/Loom-Setup.exe" `
            --title "Loom v${{ steps.versao.outputs.numero }}" `
            --notes "Instalador gerado automaticamente do commit ${{ github.sha }} (versao ${{ steps.versao.outputs.numero }}). Traz o terminal, o coletor de consumo e o runtime do Qt; nao exige Python na maquina." `
            --latest

  build-linux:
    # Depois do Windows, porque a release nasce la e aqui o pacote entra nela. Se este job falhar, o
    # exe ja saiu. Fixo no 24.04 porque o pacote roda da glibc dele pra cima: quanto mais velho o
    # runner, mais distros aceitam.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # o commit do incremento de versao, que o job do Windows acabou de gravar
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar as bibliotecas que o Qt pede
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libbrotli1 libdbus-1-3 libegl1 libexpat1 libfontconfig1 libfreetype6 \
            libgbm1 libgl1 libglib2.0-0t64 libgssapi-krb5-2 libnspr4 libnss3 libudev1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libx11-6 libx11-xcb1 \
            libxcb-cursor0 libxcb-dri3-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xkb1 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxkbcommon-x11-0 libxkbcommon0 libxkbfile1 libxrandr2 libxtst6 libzstd1 zlib1g

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Rodar a bateria de testes
        run: python testes/rodar.py

      - name: Build do app (PyInstaller)
        run: pyinstaller packaging/Loom.spec --noconfirm --distpath dist --workpath build

      - name: Empacotar
        run: |
          cp packaging/instalar-linux.sh packaging/loom.png dist/Loom/
          tar -czf dist/Loom-Linux-x64.tar.gz -C dist Loom

      - name: Publicar na release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest dist/Loom-Linux-x64.tar.gz --clobber
